services:
  - type: web
    name: ai-qa-platform-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    disk:
      name: qa-platform-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATA_DIR
        value: /app/data
